# X-1：CI 门禁 —— main 与 PR 必须全绿（后端编译+测试，前端类型检查+构建）
# X-2：DB 集成测试 —— Testcontainers MySQL 8.4 跑全量 Flyway 迁移 + 各 Jdbc 仓储往返（独立 job）
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端 (mvn verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build & test
        run: mvn -B -ntp verify

  backend-integration-db:
    name: 后端 DB 集成测试 (Testcontainers MySQL)
    runs-on: ubuntu-latest # ubuntu runner 自带 Docker，Testcontainers 直接可用
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 构建依赖模块（跳过测试）
        run: mvn -B -ntp -DskipTests install -pl sjherp-app -am
      - name: 运行 integration-db 测试（全量 Flyway 迁移 + 仓储往返 + 幽灵审计防护）
        # 父 POM 默认 excludedGroups=integration,integration-db,perf；此处显式反转只跑 integration-db
        # sjherp-app 含 GhostAuditPreventionIntegrationTest（D-8：外层事务回滚后 audit_log 必须无记录）
        run: mvn -B -ntp test -pl sjherp-infra,sjherp-app -Dgroups=integration-db -DexcludedGroups=none

  frontend:
    name: 前端 (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build

  deploy:
    name: 部署资产 (compose + 镜像)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: 脚本 dry-run 与 compose config
        run: |
          chmod +x deploy/install.sh deploy/upgrade.sh deploy/smoke.sh deploy/backup.sh deploy/restore.sh deploy/restore-smoke.sh deploy/monitor.sh deploy/perf.sh deploy/nginx/40-sjherp-tls.sh
          ./deploy/install.sh --check
          ./deploy/upgrade.sh --check
      - name: 一键安装冒烟（构建镜像、启动、探活）
        run: ./deploy/install.sh --skip-docker-install
      - name: 备份恢复冒烟（MySQL 备份→金丝雀→恢复→登录）
        run: ./deploy/restore-smoke.sh
      - name: 监控巡检（健康/磁盘/备份新鲜度/Prometheus）
        run: ./deploy/monitor.sh
      - name: 性能基线冒烟（索引 + 只读 EXPLAIN）
        run: ./deploy/perf.sh --smoke
      - name: 失败时打印容器日志
        if: failure()
        run: docker compose --project-directory deploy -f deploy/docker-compose.yml --env-file deploy/.env logs --tail 200
      - name: 清理数据卷
        if: always()
        # 仅 CI 临时环境回收磁盘，不是生产恢复路径；生产恢复见 docs/部署-备份恢复.md
        run: docker compose --project-directory deploy -f deploy/docker-compose.yml --env-file deploy/.env down -v
