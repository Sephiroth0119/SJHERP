# SJHERP 应用配置
spring:
  application:
    name: sjherp

  # MySQL 数据源。业务数据库为 MySQL 8.x，InnoDB，强事务；金额字段一律 DECIMAL。
  # 默认值指向开发 VM（192.168.237.133，dq-mysql 容器；新环境可用 deploy/docker-compose.dev.yml 复现）。
  # 注意：默认密码仅限私有仓库 + 开发环境；生产环境必须用环境变量
  # SJHERP_DB_URL / SJHERP_DB_USERNAME / SJHERP_DB_PASSWORD 覆盖，禁止把生产口令写进任何文件。
  datasource:
    url: ${SJHERP_DB_URL:jdbc:mysql://192.168.237.133:3306/sjherp}
    username: ${SJHERP_DB_USERNAME:sjherp_app}
    password: ${SJHERP_DB_PASSWORD:sjherp_dev_2026}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Flyway 数据库迁移（脚本位于 sjherp-infra 模块 classpath:db/migration，随应用启动自动执行）
  flyway:
    enabled: true

server:
  port: 8080

sjherp:
  # 认证（M2-T05）：JWT HS256。
  # 警告：jwt-secret 默认值仅限本地开发！生产环境必须用环境变量 SJHERP_JWT_SECRET
  # 覆盖（≥ 32 字节随机串），否则任何人都能伪造登录态。
  security:
    jwt-secret: ${SJHERP_JWT_SECRET:sjherp-dev-only-secret-change-me-in-production-0123456789}
    jwt-expire-hours: 12   # token 有效期（小时）

  # LLM 接入（当前实现：DeepSeek，OpenAI 兼容 API）。
  # api-key 绝不写进任何会被 git 跟踪的文件：用环境变量 SJHERP_LLM_API_KEY，
  # 或本地开发用 local profile（src/main/resources/application-local.yml，已被 .gitignore 忽略）。
  llm:
    api-key: ${SJHERP_LLM_API_KEY:}
    base-url: https://api.deepseek.com
    model: deepseek-chat
    temperature: 0.7
    timeout-seconds: 60
  # 聊天 Agent 模式：auto（默认，api-key 非空用 LlmAgent，否则回退 PlaceholderAgent 并打 WARN）
  # / llm（强制 LLM，缺 key 启动失败）/ placeholder（强制规则占位）
  agent:
    mode: auto
    # 执行循环（M1-T02）防护参数
    max-iterations: 8            # 最大 LLM 迭代次数，用尽后强制终轮收尾
    loop-timeout-seconds: 300    # 循环整体超时预算（覆盖全部 LLM 调用与工具执行）
    # 终轮 JSON 模式：separate-final-call（默认）/ with-tools。
    # DeepSeek 实测（2026-06）：response_format=json_object 与 tools 同时携带不报错，
    # 但模型稳定不发起工具调用（4/4 复现），故必须用 separate-final-call
    # （工具轮不带 json_object，模型不再调工具后终轮单独调一次 json_object）。
    final-json-mode: separate-final-call
    # 会话上下文治理（M1-T05）：发给 LLM 的历史估算 token（字符数启发式，非精确值）
    # 超过预算时，把最旧的若干轮压缩为摘要（保留最近 keep-recent-rounds 轮），
    # 摘要存 agent_session.history_summary（V8 迁移）。完整历史仍在 agent_message 表，
    # 会话回放 API 不受影响；摘要生成失败时本次硬截断（只带最近 N 轮），不阻塞对话。
    history-token-budget: 8000   # 历史窗口 token 预算
    keep-recent-rounds: 6        # 压缩时保留的最近对话轮数
