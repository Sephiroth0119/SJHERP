# SJHERP 应用配置
spring:
  application:
    name: sjherp

  # MySQL 数据源。业务数据库为 MySQL 8.x，InnoDB，强事务；金额字段一律 DECIMAL。
  # 必须通过环境变量配置，不提供弱默认值（公开仓库安全要求）。
  # 环境变量：SJHERP_DB_URL / SJHERP_DB_USERNAME / SJHERP_DB_PASSWORD
  # 本地开发可用 application-local.yml（已被 .gitignore 忽略）覆盖。
  datasource:
    url: ${SJHERP_DB_URL:}
    username: ${SJHERP_DB_USERNAME:}
    password: ${SJHERP_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      # 容器里 MySQL 刚 healthy 时仍可能短暂拒绝连接；等待而不是立刻失败
      initialization-fail-timeout: 60000

  # Flyway 数据库迁移（脚本位于 sjherp-infra 模块 classpath:db/migration，随应用启动自动执行）
  flyway:
    enabled: true

server:
  port: 8080

# 监控（M8-T04）：Prometheus 文本 + health。生产 compose 把 management 端口设为 8081，
# 仅映射 127.0.0.1，nginx 不反代 /actuator。测试不设 management.port，仍走主端口便于切片。
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
  info:
    env:
      enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

sjherp:
  # 认证（M2-T05）：JWT HS256。
  # jwt-secret 必须通过环境变量 SJHERP_JWT_SECRET 配置（≥ 32 字节随机串）。
  # 公开仓库不提供弱默认值——启动时校验，未配置或过短会 fail-fast。
  # 生成方式：openssl rand -base64 32
  security:
    jwt-secret: ${SJHERP_JWT_SECRET:}
    jwt-expire-hours: 12   # token 有效期（小时）
    # API 限流（M8-T03）：登录/改密与聊天发消息。工作台列表刷新不限。
    rate-limit:
      enabled: ${SJHERP_RATE_LIMIT_ENABLED:true}
      login-per-minute: ${SJHERP_RATE_LIMIT_LOGIN:20}
      chat-per-minute: ${SJHERP_RATE_LIMIT_CHAT:60}
      trust-forwarded-headers: true
    # 生产 compose 设 true，禁止带着 local/dev 把 swagger 放到公网
    forbid-dev-profile: ${SJHERP_FORBID_DEV_PROFILE:false}
  # 初始管理员密码（首次启动时创建 admin 账户用）。
  # 必须通过环境变量 SJHERP_ADMIN_PASSWORD 配置（≥ 8 位，须含大写、小写和数字）。
  # 未配置或不符合密码强度要求会 fail-fast。
  admin:
    password: ${SJHERP_ADMIN_PASSWORD:}

  # 演示种子试点（M8-T07）：默认关闭。打开后启动时经领域/应用服务装入「演示*」虚构企业。
  # 生产一键安装不要打开；预发/本地用 deploy/seed-pilot.sh 或本开关。
  demo-seed:
    enabled: ${SJHERP_DEMO_SEED:false}
    pack: ${SJHERP_DEMO_SEED_PACK:sunshine}

  # 离线许可（M8-T08）：私有部署默认不挡业务。放置签名文件后按规则校验；
  # 硬阻断仅 SJHERP_LICENSE_ENFORCE=true 时对过期/坏签名生效。商业模式未定，无在线支付。
  license:
    path: ${SJHERP_LICENSE_PATH:}
    public-key: ${SJHERP_LICENSE_PUBLIC_KEY:}
    public-key-path: ${SJHERP_LICENSE_PUBLIC_KEY_PATH:}
    enforce: ${SJHERP_LICENSE_ENFORCE:false}
    default-grace-days: ${SJHERP_LICENSE_GRACE_DAYS:14}
    refresh-ms: ${SJHERP_LICENSE_REFRESH_MS:3600000}

  # 库存与成本（M3-T01，拆解见 docs/M3拆解-库存与成本.md）。
  inventory:
    # 负库存开关（§1.5）：默认禁止——出库后数量为负时抛 InsufficientStockException 整体回滚。
    # 设为 true 仅解除数量校验，成本口径退化（数量 ≤ 0 时取最近一笔流水单价，估计值，
    # 回正后不追溯重算）；打开需在部署文档确认，检查 Agent（M6-T06）会标红负库存行。
    allow-negative-stock: false
    # 成本核算方法（Q-2 预留，全局统一不可按商品混用）：v1.0 仅支持 MOVING_AVERAGE（移动加权，
    # 单价 6 位 HALF_UP / 金额 2 位 HALF_UP / 出空清零）；FIFO 留实现位，配置其他值启动期报错。
    costing-method: MOVING_AVERAGE

  # 运维监控（M8-T04）：LLM 日报读 agent_invocation 真源；单价未配则只出 token、不编造金额。
  ops:
    alert-webhook: ${SJHERP_ALERT_WEBHOOK:}
    llm-daily-enabled: ${SJHERP_LLM_DAILY_ENABLED:true}
    llm-daily-cron: "0 5 0 * * *"
    alert-llm-daily: ${SJHERP_ALERT_LLM_DAILY:false}
    llm-prompt-price-per-million: ${SJHERP_LLM_PRICE_PROMPT_PER_MILLION:}
    llm-completion-price-per-million: ${SJHERP_LLM_PRICE_COMPLETION_PER_MILLION:}

  # 数据一致性校验（M3-T13 检查 Agent）。按需查走 REST/Agent 工具随时可跑；定时巡检参数如下。
  consistency:
    # 定时巡检开关（@ConditionalOnProperty）：默认关——本地/测试不跑（避免污染、并发抢库），
    # 生产 compose 通过 SJHERP_CONSISTENCY_ENABLED=true 打开。打开后按 cron 自动跑校验并按严重度记日志告警。
    enabled: ${SJHERP_CONSISTENCY_ENABLED:false}
    # 巡检 cron（默认每日凌晨 3 点）。仅 enabled=true 时生效。
    cron: "0 0 3 * * *"

  # 系统大记忆基建（M6-T01）：MySQL 为完整真源，Ollama/Qdrant 仅在显式开启后连接。
  # 默认关闭，既有开发/测试环境无需安装本地服务即可启动。
  memory:
    enabled: ${SJHERP_MEMORY_ENABLED:false}
    embedding:
      provider: ollama
      base-url: ${SJHERP_OLLAMA_URL:http://localhost:11434}
      model: ${SJHERP_OLLAMA_MODEL:qwen3-embedding:0.6b}
      dimension: 1024
      timeout-seconds: 60
    vector:
      provider: qdrant
      base-url: ${SJHERP_QDRANT_URL:http://localhost:6333}
      collection: sjherp-memory-qwen3-0_6b-1024-v1
      distance: COSINE
    indexing:
      retry-delay-seconds: 30
      batch-size: 50
      max-retries: 8

  # LLM 接入（M1-T07 多 provider 配置化，切换模型不改代码）。
  # - providers（map）：provider 名 → 连接配置（base-url / model / api-key / temperature /
  #   timeout-seconds）。所有 provider 走 OpenAI 兼容协议（OpenAiCompatibleLlmClient 一套实现），
  #   DeepSeek / 通义 compatible-mode / Kimi / GPT 均可，新增 provider 只加配置。
  # - roles（map）：Agent 角色 → provider 名。chat=对话主链路、summarizer=历史摘要、
  #   checker=数据一致性检查 Agent（M6 接入，先留配置位）；未配置的角色回落 default-provider。
  #   roles / default-provider 指向未定义的 provider 名会在启动期 fail-fast 报错。
  # - api-key 绝不写进任何会被 git 跟踪的文件：用环境变量引用（如下），或本地开发用
  #   local profile（src/main/resources/application-local.yml，已被 .gitignore 忽略，
  #   写法：sjherp.llm.providers.<名>.api-key: sk-xxx）。
  # - 迁移说明（2026-06 干净迁移，不保留兼容）：原平铺结构 sjherp.llm.api-key /
  #   base-url / model / temperature / timeout-seconds 已废弃，等价于现在的
  #   providers.deepseek.* + 全部角色指向 deepseek；local profile 需同步改为嵌套写法。
  llm:
    default-provider: deepseek
    providers:
      deepseek:
        base-url: https://api.deepseek.com
        model: deepseek-chat
        api-key: ${SJHERP_LLM_API_KEY:}
        temperature: 0.7
        timeout-seconds: 60
      # 示例：再接一个通义（OpenAI compatible-mode），把某个角色指过去即可——
      # qwen:
      #   base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      #   model: qwen-plus
      #   api-key: ${SJHERP_LLM_QWEN_API_KEY:}
    roles:
      chat: deepseek        # 对话主链路（LlmAgent + AgentLoop）
      summarizer: deepseek  # 会话历史摘要（M1-T05；失败时硬截断兜底，不影响对话）
      checker: deepseek     # 检查 Agent（M6 接入，建议配强模型）
    # 数据出境（M8-T03 / Q-7）：第三方模型告知 + 可选脱敏 + 仅本地模型
    egress:
      notice-enabled: ${SJHERP_LLM_NOTICE:true}
      redact-enabled: ${SJHERP_LLM_REDACT:false}
      local-only: ${SJHERP_LLM_LOCAL_ONLY:false}
  # 聊天 Agent 模式：auto（默认，api-key 非空用 LlmAgent，否则回退 PlaceholderAgent 并打 WARN）
  # / llm（强制 LLM，缺 key 启动失败）/ placeholder（强制规则占位）
  agent:
    mode: auto
    # 执行循环（M1-T02）防护参数
    max-iterations: 8            # 最大 LLM 迭代次数，用尽后强制终轮收尾
    loop-timeout-seconds: 300    # 循环整体超时预算（覆盖全部 LLM 调用与工具执行）
    # 终轮 JSON 模式：separate-final-call（默认）/ with-tools。
    # DeepSeek 实测（2026-06）：response_format=json_object 与 tools 同时携带不报错，
    # 但模型稳定不发起工具调用（4/4 复现），故必须用 separate-final-call
    # （工具轮不带 json_object，模型不再调工具后终轮单独调一次 json_object）。
    final-json-mode: separate-final-call
    # 会话上下文治理（M1-T05）：发给 LLM 的历史估算 token（字符数启发式，非精确值）
    # 超过预算时，把最旧的若干轮压缩为摘要（保留最近 keep-recent-rounds 轮），
    # 摘要存 agent_session.history_summary（V8 迁移）。完整历史仍在 agent_message 表，
    # 会话回放 API 不受影响；摘要生成失败时本次硬截断（只带最近 N 轮），不阻塞对话。
    history-token-budget: 8000   # 历史窗口 token 预算
    keep-recent-rounds: 6        # 压缩时保留的最近对话轮数

# API 文档（knife4j + springdoc）：
# 生产姿态默认关闭；仅 dev/local profile 开启（见下方 --- 文档块）。
# 安全配置（SecurityConfig）在 dev/local profile 下放行 /doc.html、/v3/api-docs/**、
# /webjars/**、/favicon.ico；生产姿态这些路径保持 401。
springdoc:
  api-docs:
    enabled: false   # 生产默认关闭；dev/local profile 覆盖为 true
knife4j:
  enable: false      # 生产默认关闭；dev/local profile 覆盖为 true

---
# ================================================================
# local / dev profile 配置块（仅在 spring.profiles.active=local 或 dev 时生效）
# 用于本地开发与开发环境：开启 knife4j API 文档（/doc.html）与 springdoc 元数据接口。
# 生产环境绝对不得激活 local/dev profile。
# ================================================================
spring:
  config:
    activate:
      on-profile: "local,dev"

springdoc:
  api-docs:
    enabled: true    # 仅 dev/local：开放 /v3/api-docs/**
  swagger-ui:
    enabled: true
knife4j:
  enable: true       # 仅 dev/local：开放 /doc.html
