worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    resolver 127.0.0.11 ipv6=off valid=10s;

    limit_req_zone $binary_remote_addr zone=sjherp_login:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=sjherp_chat:10m rate=60r/m;
    limit_req_status 429;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HTTP：探活保持明文；其余跳转到 HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location = /api/health {
            include /etc/nginx/api-proxy.conf.inc;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /api/auth/login {
            limit_req zone=sjherp_login burst=10 nodelay;
            include /etc/nginx/api-proxy.conf.inc;
        }

        location ~ ^/api/chat/sessions/[^/]+/messages$ {
            limit_req zone=sjherp_chat burst=20 nodelay;
            include /etc/nginx/api-proxy.conf.inc;
        }

        location /api/ {
            include /etc/nginx/api-proxy.conf.inc;
        }

        location /assets/ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
