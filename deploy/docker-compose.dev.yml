# SJHERP 开发中间件声明（MySQL 真源 + Qdrant 派生索引）
#
# 重要说明：
# - 当前实际开发环境是 VM 192.168.237.133 上**手工 docker run** 的两个容器：
#     dq-mysql       -> mysql:8.4            （3306，库 sjherp，应用账号 sjherp_app）
#     sjherp-qdrant  -> qdrant/qdrant:v1.13.4（6333 HTTP / 6334 gRPC）
#   本文件不是那台 VM 的运行来源，而是把同一套环境声明化，用于在新环境一键复现：
#     MYSQL_ROOT_PASSWORD=xxx docker compose -f deploy/docker-compose.dev.yml up -d
# - 国内网络拉镜像慢/失败时，可给镜像加 DaoCloud 加速前缀，例如：
#     docker.m.daocloud.io/library/mysql:8.4
#     docker.m.daocloud.io/qdrant/qdrant:v1.13.4
# - 应用侧连接配置见 server/sjherp-app/src/main/resources/application.yml
#  （环境变量 SJHERP_DB_URL / SJHERP_DB_USERNAME / SJHERP_DB_PASSWORD）。
# - M6-T01 大记忆默认关闭。启用时设置 SJHERP_MEMORY_ENABLED=true；
#   Qdrant 默认 http://localhost:6333，可用 SJHERP_QDRANT_URL 覆盖。
# - Ollama 在 Windows 宿主机本地安装，不由本 compose 管理：
#     ollama pull qwen3-embedding:0.6b
#   默认 http://localhost:11434，可用 SJHERP_OLLAMA_URL 覆盖。业务文本不走外部 Embedding。

services:
  mysql:
    image: mysql:8.4
    container_name: dq-mysql
    restart: unless-stopped
    environment:
      # root 密码不写入仓库，必须通过环境变量传入
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须通过环境变量提供 MySQL root 密码}
      # 应用库与应用账号（与 application.yml 的开发默认值保持一致）
      MYSQL_DATABASE: sjherp
      MYSQL_USER: sjherp_app
      MYSQL_PASSWORD: ${SJHERP_DB_PASSWORD:-sjherp_dev_2026}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: sjherp-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  mysql-data:
  qdrant-data:
