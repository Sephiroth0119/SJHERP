# SJHERP 生产编排（M8-T01）
#
# 覆盖：nginx（静态前端 + /api 反代）/ app（Spring Boot + Flyway）/ MySQL 8.4 / Qdrant
# 密钥一律来自 deploy/.env（模板见 .env.example，禁止提交真实密钥）
#
# 由安装/升级脚本调用；手动启动：
#   docker compose --project-directory <仓库根> -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# 国内拉镜像慢时，给 Docker 配镜像加速（见 docs/部署-一键安装.md「常见失败」）。
#
# 备份约定（M8-T02，见 docs/部署-备份恢复.md）：
# - 定时备份由宿主机 cron 调用 ./deploy/backup.sh（模板 deploy/crontab.example）
# - 文件落在 ./backups/{mysql,qdrant}/（宿主机磁盘，不在 named volume 里）
# - Qdrant 快照目录 bind 到 ./backups/qdrant/live
# - 恢复走 ./deploy/restore.sh；禁止把 docker compose down -v 当常规恢复
#
# 监控（M8-T04，见 docs/部署-监控告警.md）：
# - app management 端口 8081 只映射 127.0.0.1，供 Prometheus 文本刮取
# - 宿主机 cron 调 ./deploy/monitor.sh（磁盘/备份新鲜度/健康/ERROR 日志）
#
# 性能（M8-T05，见 docs/部署-性能基线.md）：
# - MySQL 打开慢查询日志（long_query_time=1），文件在数据卷 datadir
# - 压测脚本 ./deploy/perf.sh；不要对生产库灌百万行合成数据

name: sjherp

x-sjherp-backup:
  cron: deploy/crontab.example
  script: ./deploy/backup.sh
  restore: ./deploy/restore.sh
  keep_days_env: SJHERP_BACKUP_KEEP_DAYS
  mysql_dir: ./backups/mysql
  qdrant_dir: ./backups/qdrant
  monitor: ./deploy/monitor.sh

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 deploy/.env 设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sjherp}
      MYSQL_USER: ${MYSQL_USER:-sjherp_app}
      MYSQL_PASSWORD: ${SJHERP_DB_PASSWORD:?请在 deploy/.env 设置 SJHERP_DB_PASSWORD}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --skip-name-resolve
      - --slow-query-log=ON
      - --long-query-time=1
      - --log-output=FILE
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # mysql:8.4 官方镜像没有 healthcheck.sh，用 mysqladmin
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - sjherp
    # 生产不把 3306 暴露到宿主机

  qdrant:
    image: qdrant/qdrant:v1.13.4
    restart: unless-stopped
    environment:
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/snapshots
    volumes:
      - qdrant-data:/qdrant/storage
      # 快照落到宿主机，便于 backup.sh 归档；不要把这个目录放进 named volume
      - ./backups/qdrant/live:/qdrant/snapshots
    networks:
      - sjherp
    # 生产不把 6333/6334 暴露到宿主机。
    # 大记忆默认关闭，app 启动不依赖 Qdrant 探活；镜像内不一定有 curl/bash /dev/tcp。

  app:
    build:
      context: ..
      dockerfile: deploy/app/Dockerfile
    image: sjherp-app:local
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: ${SJHERP_DB_URL:?请在 deploy/.env 设置 SJHERP_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${SJHERP_DB_USERNAME:-sjherp_app}
      SPRING_DATASOURCE_PASSWORD: ${SJHERP_DB_PASSWORD:?请在 deploy/.env 设置 SJHERP_DB_PASSWORD}
      SJHERP_DB_URL: ${SJHERP_DB_URL:?请在 deploy/.env 设置 SJHERP_DB_URL}
      SJHERP_DB_USERNAME: ${SJHERP_DB_USERNAME:-sjherp_app}
      SJHERP_DB_PASSWORD: ${SJHERP_DB_PASSWORD:?请在 deploy/.env 设置 SJHERP_DB_PASSWORD}
      SJHERP_JWT_SECRET: ${SJHERP_JWT_SECRET:?请在 deploy/.env 设置 SJHERP_JWT_SECRET}
      SJHERP_ADMIN_PASSWORD: ${SJHERP_ADMIN_PASSWORD:?请在 deploy/.env 设置 SJHERP_ADMIN_PASSWORD}
      SJHERP_QDRANT_URL: ${SJHERP_QDRANT_URL:-http://qdrant:6333}
      SJHERP_MEMORY_ENABLED: ${SJHERP_MEMORY_ENABLED:-false}
      SJHERP_LLM_API_KEY: ${SJHERP_LLM_API_KEY:-}
      SJHERP_LLM_NOTICE: ${SJHERP_LLM_NOTICE:-true}
      SJHERP_LLM_REDACT: ${SJHERP_LLM_REDACT:-false}
      SJHERP_LLM_LOCAL_ONLY: ${SJHERP_LLM_LOCAL_ONLY:-false}
      SJHERP_RATE_LIMIT_ENABLED: ${SJHERP_RATE_LIMIT_ENABLED:-true}
      SJHERP_RATE_LIMIT_LOGIN: ${SJHERP_RATE_LIMIT_LOGIN:-20}
      SJHERP_RATE_LIMIT_CHAT: ${SJHERP_RATE_LIMIT_CHAT:-60}
      SJHERP_FORBID_DEV_PROFILE: ${SJHERP_FORBID_DEV_PROFILE:-true}
      SJHERP_CONSISTENCY_ENABLED: ${SJHERP_CONSISTENCY_ENABLED:-true}
      MANAGEMENT_SERVER_PORT: 8081
      SJHERP_ALERT_WEBHOOK: ${SJHERP_ALERT_WEBHOOK:-}
      SJHERP_ALERT_LLM_DAILY: ${SJHERP_ALERT_LLM_DAILY:-false}
      SJHERP_LLM_DAILY_ENABLED: ${SJHERP_LLM_DAILY_ENABLED:-true}
      SJHERP_LLM_PRICE_PROMPT_PER_MILLION: ${SJHERP_LLM_PRICE_PROMPT_PER_MILLION:-}
      SJHERP_LLM_PRICE_COMPLETION_PER_MILLION: ${SJHERP_LLM_PRICE_COMPLETION_PER_MILLION:-}
      JAVA_TOOL_OPTIONS: ${SJHERP_JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8 -Duser.timezone=UTC}
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    ports:
      # 仅本机刮取 Prometheus；不要改成 0.0.0.0
      - "127.0.0.1:${SJHERP_METRICS_PORT:-8081}:8081"
    networks:
      - sjherp

  nginx:
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
    image: sjherp-web:local
    restart: unless-stopped
    environment:
      SJHERP_TLS_MODE: ${SJHERP_TLS_MODE:-self-signed}
    ports:
      - "${SJHERP_HTTP_PORT:-80}:80"
      - "${SJHERP_HTTPS_PORT:-443}:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - sjherp

volumes:
  mysql-data:
  qdrant-data:

networks:
  sjherp:
    driver: bridge
